<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;
  font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;color:#eef2f8;
  background:
    radial-gradient(1400px 800px at 78% -10%, rgba(201,162,39,.14), transparent 60%),
    radial-gradient(1100px 700px at 0% 0%, rgba(30,58,95,.65), transparent 60%),
    #070c16;}
.slide{width:1920px;height:1080px;display:flex;flex-direction:column;justify-content:center;padding:100px 150px;position:relative}
.kicker{font-size:26px;letter-spacing:6px;text-transform:uppercase;color:#c9a227;font-weight:700;margin-bottom:26px}
h1{font-size:118px;line-height:1.04;letter-spacing:-2px;font-weight:800}
h2{font-size:74px;line-height:1.08;letter-spacing:-1.5px;font-weight:800;margin-bottom:28px}
.sub{font-size:33px;color:#a8b6cc;line-height:1.5;max-width:1150px;font-weight:400}
.gold{color:#e6c65c}
.rule{width:180px;height:6px;border-radius:3px;background:linear-gradient(90deg,#e6c65c,#c9a227);margin:40px 0}
.chips{display:flex;gap:22px;margin-top:50px}
.chip2{padding:19px 36px;border:1.5px solid rgba(255,255,255,.16);border-radius:16px;font-size:26px;font-weight:600;color:#dfe7f2;background:rgba(255,255,255,.04)}
ul.big{list-style:none;margin-top:40px}
ul.big li{font-size:32px;line-height:1.45;padding-left:50px;position:relative;margin-bottom:22px;color:#dbe4f0}
ul.big li::before{content:'';position:absolute;left:0;top:16px;width:15px;height:15px;border-radius:50%;
  background:linear-gradient(145deg,#e6c65c,#c9a227)}
.num{position:absolute;right:70px;top:64px;font-size:23px;color:#5d6f8c;font-weight:700;letter-spacing:2px}
.brand{position:absolute;left:150px;bottom:52px;display:flex;align-items:center;gap:18px}
.bmark{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#0b1220;
  background:linear-gradient(145deg,#e6c65c,#c9a227)}
.bname{font-size:23px;font-weight:700;color:#c8d4e6;line-height:1.3}
.bname small{display:block;font-size:16px;color:#7f90aa;font-weight:400}
.two{display:flex;gap:60px;align-items:center;margin-top:16px}
.panel{background:rgba(15,24,40,.75);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:42px 50px}
.stat{font-size:56px;font-weight:800;color:#e6c65c;letter-spacing:-1px}
.statlab{font-size:22px;color:#a8b6cc;margin-top:8px;max-width:420px}
/* shot panel: framed screenshot, fits ABOVE the subtitle bar */
.shotwrap{position:absolute;right:110px;top:150px;width:880px}
.shotcap{font-size:19px;color:#8fa1bb;letter-spacing:1px;margin-bottom:14px}
.shot{width:100%;border-radius:18px;border:1px solid rgba(255,255,255,.18);box-shadow:0 50px 110px -30px rgba(0,0,0,.85);display:block}
/* subtitle bar ABOVE the brand, never overlapping */
.subtitle-bar{position:absolute;left:0;right:0;bottom:150px;display:flex;justify-content:center}
.subtitle-pill{background:rgba(5,10,18,.85);border:1px solid rgba(255,255,255,.16);border-radius:16px;
  padding:22px 48px;font-size:32px;font-weight:500;color:#fff;letter-spacing:.2px;max-width:1500px;text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.55)}
</style></head>
<body><div class="slide">
  <div class="kicker">Treasure Mountain Jewelshop Ltd</div>
  <h1>TMJ <span class="gold">PO</span> Studio</h1>
  <div class="rule"></div>
  <p class="sub">From Albern purchase orders to finished Treasure Mountain invoices —<br>in minutes, not hours.</p>
  <div class="chips"><div class="chip2">Import PDFs</div><div class="chip2">Auto-parse</div><div class="chip2">Approve</div><div class="chip2">Generate</div></div>
<div class="subtitle-bar"><div class="subtitle-pill">TMJ PO Studio — Purchase orders made simple</div></div><div class="brand"><div class="bmark">TM</div><div class="bname">TMJ PO Studio<small>Treasure Mountain Jewelshop Ltd</small></div></div><div class="num">01 / 12</div></div></body></html>
